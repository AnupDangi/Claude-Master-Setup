name: Master CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  self-check:
    name: Adaptive loop checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/*.py .claude/hooks/*.sh || true

      - name: Self-check
        run: bash scripts/self-check.sh

      - name: npm test + package dry-run
        run: |
          npm test
          npm pack --dry-run

      - name: Loop setup / cancel / classify smoke
        run: |
          export CLAUDE_PROJECT_DIR="$(mktemp -d)"
          mkdir -p "$CLAUDE_PROJECT_DIR"
          bash scripts/setup-loop.sh "fix typo" | tee /tmp/setup.out
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path(os.environ["CLAUDE_PROJECT_DIR"], ".master/state/loop.json").read_text())
          assert state["max_iterations"] == 2
          assert state["execution_mode"] == "direct"
          assert state["active"] is True
          PY
          bash scripts/cancel-loop.sh
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path(os.environ["CLAUDE_PROJECT_DIR"], ".master/state/loop.json").read_text())
          assert state["status"] == "cancelled"
          assert state["active"] is False
          PY
          python3 scripts/classify-task.py "implement authentication feature" | python3 -c 'import json,sys; assert json.load(sys.stdin)["execution_mode"]=="delegated"'

      - name: Worktree fan-out rejects bad manifest
        run: |
          printf '%s\n' '{"slices":[{"id":"../x","branch":"fanout/a","files":["a.ts"]}]}' > /tmp/bad.json
          if bash scripts/worktree-fanout.sh status /tmp/bad.json; then
            echo "expected failure" >&2
            exit 1
          fi

      - name: Select-skills + ensure-skills JSON
        run: |
          MASTER_SKIP_SKILLS=1 bash scripts/select-skills.sh "validation tests" 2 \
            | python3 -c "import json,sys; data=json.load(sys.stdin); assert isinstance(data, list) and len(data)<=2"
          MASTER_SKIP_SKILLS=1 bash scripts/ensure-skills.sh "validation tests" 2 \
            | python3 -c "import json,sys; data=json.load(sys.stdin); assert isinstance(data, list) and len(data)<=2"
          bash scripts/install-skill.sh --suggest "react frontend performance" \
            | python3 -c "import json,sys; data=json.load(sys.stdin); assert isinstance(data, list)"
          # Reject unallowlisted source without TRUST_ANY (still exit 0 unless --strict)
          bash scripts/install-skill.sh evil/repo --skill "x" > /tmp/skill-deny.log 2>&1 || true
          grep -qE "not in skills allowlist|invalid source|suggest" /tmp/skill-deny.log

      - name: Runtime skill scripts present
        run: |
          test -x scripts/install-skill.sh
          test -x scripts/ensure-skills.sh
          test -f templates/skills-allowlist.json
          python3 -c "import json; d=json.load(open('templates/skills-allowlist.json')); assert d.get('runtime')"

      - name: Protect-paths blocks .env
        run: |
          echo '{"file_path":"/tmp/proj/.env"}' | HARNESS_ALLOW_PROTECTED_EDITS=0 bash .claude/hooks/protect-paths.sh && exit 1 || true
          echo '{"file_path":"/tmp/proj/.env"}' | HARNESS_ALLOW_PROTECTED_EDITS=1 bash .claude/hooks/protect-paths.sh

      - name: Validate.sh reports a gate
        run: |
          set +e
          bash scripts/validate.sh | tee /tmp/validate.log
          set -e
          grep -qE "GATE: (GREEN|RED)" /tmp/validate.log
