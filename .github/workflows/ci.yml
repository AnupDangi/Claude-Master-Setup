# Agent Master tests, package checks, and Claude adapter marketplace tag.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/*.py .claude/hooks/*.sh || true

      - name: Self-check
        run: bash scripts/self-check.sh

      - name: npm test + package dry-runs
        run: |
          npm test
          npm pack --dry-run
          npm pack ./compat/claude-master-setup --dry-run

      - name: Skills allowlist snapshot
        run: bash scripts/check-skills-allowlist.sh

      - name: Golden loop smoke
        run: bash scripts/test-golden-loop.sh

      - name: Universal CLI start / cancel smoke
        run: |
          PROJ="$(mktemp -d)"
          cd "$PROJ"
          git init -q
          git config user.email "ci@example.test"
          git config user.name "CI"
          printf '%s\n' '{"name":"ci-fixture","scripts":{"test":"node -e \"process.exit(0)\""}}' > package.json
          echo '# fixture' > README.md
          git add -A && git commit -q -m init
          node "$GITHUB_WORKSPACE/bin/cli.js" init --force >/dev/null || node "$GITHUB_WORKSPACE/bin/cli.js" init >/dev/null || true
          # seed minimal project if init needs cwd package
          if [ ! -f .master/project.json ]; then
            mkdir -p .master/runs .master/events .master/evidence .master/locks .master/docs
            printf '%s\n' '{"schema_version":2,"name":"ci-fixture","maturity":"new","test_commands":[],"sources_of_truth":["README.md"]}' > .master/project.json
          fi
          RUN_ID="$(node "$GITHUB_WORKSPACE/bin/cli.js" start "ci smoke" --agent claude-code --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["run_id"])')"
          node "$GITHUB_WORKSPACE/bin/cli.js" cancel --run "$RUN_ID" --agent claude-code --format json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          runs = list(Path(".master/runs").glob("*.json"))
          assert runs and any(json.loads(p.read_text()).get("status") == "cancelled" for p in runs)
          print("OK universal cancel")
          PY

      - name: Select-skills + ensure-skills JSON
        run: |
          MASTER_SKIP_SKILLS=1 bash scripts/select-skills.sh "validation tests" 2 \
            | python3 -c "import json,sys; data=json.load(sys.stdin); assert isinstance(data, list) and len(data)<=2"
          MASTER_SKIP_SKILLS=1 bash scripts/ensure-skills.sh "validation tests" 2 \
            | python3 -c "import json,sys; data=json.load(sys.stdin); assert isinstance(data, list) and len(data)<=2"
          bash scripts/install-skill.sh --suggest "react frontend performance" \
            | python3 -c "import json,sys; data=json.load(sys.stdin); assert isinstance(data, list)"
          bash scripts/install-skill.sh evil/repo --skill "x" > /tmp/skill-deny.log 2>&1 || true
          grep -qE "not in skills allowlist|invalid source|suggest" /tmp/skill-deny.log

      - name: Runtime skill scripts present
        run: |
          test -x scripts/install-skill.sh
          test -x scripts/ensure-skills.sh
          test -f templates/skills-allowlist.json
          python3 -c "import json; d=json.load(open('templates/skills-allowlist.json')); assert d.get('runtime')"

      - name: Protect-paths blocks .env
        run: |
          echo '{"file_path":"/tmp/proj/.env"}' | HARNESS_ALLOW_PROTECTED_EDITS=0 bash .claude/hooks/protect-paths.sh && exit 1 || true
          echo '{"file_path":"/tmp/proj/.env"}' | HARNESS_ALLOW_PROTECTED_EDITS=1 bash .claude/hooks/protect-paths.sh

      - name: notify-stop has no eval
        run: |
          ! grep -Eq '(^|[^A-Za-z0-9_])eval ' .claude/hooks/notify-stop.sh
          grep -q RUN_ID_RE .claude/hooks/notify-stop.sh
          grep -q RUN_ID_RE .claude/hooks/session-start.sh

      - name: Marketplace manifests agree
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          mp = json.loads(Path(".claude-plugin/marketplace.json").read_text())
          assert mp.get("name"), "marketplace name required"
          assert mp.get("owner", {}).get("name"), "owner.name required"
          plugins = mp.get("plugins") or []
          assert plugins, "plugins array required"
          p = plugins[0]
          assert p.get("name") == "master"
          assert p.get("source") == "./"
          assert p.get("version"), "plugin version required for stable releases"
          pj = json.loads(Path(".claude-plugin/plugin.json").read_text())
          assert pj["version"] == p["version"], (pj["version"], p["version"])
          print("marketplace OK —", p["name"], p["version"])
          PY

  # Claude Code marketplaces are git-backed: push updates the catalog.
  # Installed plugins only auto-update when plugin.json version changes.
  marketplace-tag:
    name: Marketplace release tag
    needs: test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: ver
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          MP_VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$MP_VERSION" ]; then
            echo "::error::plugin.json ($VERSION) != marketplace plugins[0].version ($MP_VERSION)"
            exit 1
          fi

      - name: Create and push master--v* tag if missing
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="master--v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Agent Master Claude adapter ${VERSION}"
          git push origin "refs/tags/${TAG}"
          echo "Pushed $TAG"
