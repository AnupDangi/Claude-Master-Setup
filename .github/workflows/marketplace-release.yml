# Auto-publish plugin marketplace release tags when version bumps on main.
# Claude Code marketplaces are git-backed: a push updates the catalog.
# Installed plugins only auto-update when plugin.json "version" changes.
name: Marketplace release

on:
  push:
    branches: [main, master]
    paths:
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"

permissions:
  contents: write

jobs:
  validate-and-tag:
    name: Validate marketplace + tag release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: ver
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          MP_VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"
          echo "Marketplace plugin version: $MP_VERSION"
          if [ "$VERSION" != "$MP_VERSION" ]; then
            echo "::error::plugin.json version ($VERSION) != marketplace.json plugins[0].version ($MP_VERSION)"
            exit 1
          fi

      - name: Validate marketplace JSON shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          mp = json.loads(Path(".claude-plugin/marketplace.json").read_text())
          assert mp.get("name"), "marketplace name required"
          assert mp.get("owner", {}).get("name"), "owner.name required"
          plugins = mp.get("plugins") or []
          assert plugins, "plugins array required"
          p = plugins[0]
          assert p.get("name") == "master"
          assert p.get("source") == "./"
          assert p.get("version"), "plugin version required for stable releases"
          pj = json.loads(Path(".claude-plugin/plugin.json").read_text())
          assert pj["version"] == p["version"]
          print("marketplace OK —", p["name"], p["version"])
          PY

      - name: Create and push master--v* tag if missing
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="master--v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Claude Master Setup ${VERSION}"
          git push origin "refs/tags/${TAG}"
          echo "Pushed $TAG"
